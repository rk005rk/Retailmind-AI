<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set New Password — RetailMind AI</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="auth-page">

  <div class="auth-card">
    <div class="auth-header">
      <a href="index.html" class="auth-brand-badge">
        <div class="brand-icon">
          <i class="fa-solid fa-brain"></i>
        </div>
        <span class="brand-text">RetailMind</span>
        <span class="brand-badge">AI</span>
      </a>
      <h1 class="auth-title">Create New Password</h1>
      <p class="auth-subtitle">Choose a secure password for your merchant access</p>
    </div>

    <form onsubmit="handleReset(event)">
      <div class="form-group">
        <label class="form-label">New Password *</label>
        <div class="input-icon-wrapper">
          <i class="fa-solid fa-lock"></i>
          <input type="password" class="form-control" required placeholder="••••••••">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Confirm New Password *</label>
        <div class="input-icon-wrapper">
          <i class="fa-solid fa-lock"></i>
          <input type="password" class="form-control" required placeholder="••••••••">
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-bottom: 1rem;">
        <i class="fa-solid fa-check"></i> Update Password & Sign In
      </button>

      <div style="text-align: center;">
        <a href="login.html" class="btn btn-ghost btn-sm">
          <i class="fa-solid fa-arrow-left"></i> Back to Sign In
        </a>
      </div>
    </form>
  </div>

  <script src="js/app.js"></script>
  <script>
    function handleReset(e) {
      e.preventDefault();
      showToast('Password reset successfully! Redirecting...', 'success', 'fa-circle-check');
      setTimeout(() => {
        window.location.href = 'login.html';
      }, 1000);
    }
  </script>
</body>
</html>
