<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register Merchant Account — RetailMind AI</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="auth-page">

  <div class="auth-card" style="max-width: 500px;">
    <div class="auth-header">
      <a href="index.html" class="auth-brand-badge">
        <div class="brand-icon">
          <i class="fa-solid fa-brain"></i>
        </div>
        <span class="brand-text">RetailMind</span>
        <span class="brand-badge">AI</span>
      </a>
      <h1 class="auth-title">Create Retail Account</h1>
      <p class="auth-subtitle">14-day full feature trial • No credit card required</p>
    </div>

    <form onsubmit="handleRegister(event)">
      <div class="grid grid-cols-2" style="gap: 1rem;">
        <div class="form-group">
          <label class="form-label">Full Name *</label>
          <input type="text" class="form-control" required placeholder="Sana Mondal">
        </div>
        <div class="form-group">
          <label class="form-label">Phone Number *</label>
          <input type="tel" class="form-control" required placeholder="+91 98300 12345">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Store / Enterprise Name *</label>
        <div class="input-icon-wrapper">
          <i class="fa-solid fa-store"></i>
          <input type="text" class="form-control" required placeholder="e.g. Apex Supermarket & Provisions">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Work Email Address *</label>
        <div class="input-icon-wrapper">
          <i class="fa-solid fa-envelope"></i>
          <input type="email" class="form-control" required placeholder="sana@retailmind.ai">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Password *</label>
        <div class="input-icon-wrapper">
          <i class="fa-solid fa-lock"></i>
          <input type="password" class="form-control" required placeholder="Minimum 8 characters">
        </div>
      </div>

      <div style="margin-bottom: 1.5rem;">
        <label style="display: flex; align-items: flex-start; gap: 0.5rem; font-size: 0.75rem; color: var(--muted); cursor: pointer;">
          <input type="checkbox" required checked style="width: 16px; height: 16px; accent-color: var(--primary); margin-top: 2px;">
          <span>I agree to the RetailMind AI Terms of Service, Privacy Policy, and automated inventory audit processing.</span>
        </label>
      </div>

      <button type="submit" class="btn btn-primary btn-lg" style="width: 100%;">
        <i class="fa-solid fa-rocket"></i> Launch Setup Wizard
      </button>
    </form>

    <div style="text-align: center; font-size: 0.8125rem; color: var(--muted); margin-top: 1.5rem;">
      Already have an active account? 
      <a href="login.html" style="font-weight: 700; color: var(--primary);">Sign In</a>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    function handleRegister(e) {
      e.preventDefault();
      showToast('Creating merchant profile and models...', 'info', 'fa-gear fa-spin');
      setTimeout(() => {
        window.location.href = 'setup.html';
      }, 700);
    }
  </script>
</body>
</html>
