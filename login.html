<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sign In — RetailMind AI</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Sora:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <!-- Font Awesome -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  >

  <!-- RetailMind Styles -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>

<body class="auth-page">

  <!-- =========================================
       LOGIN CARD
       ========================================= -->
  <div class="auth-card">

    <!-- =========================================
         HEADER
         ========================================= -->
    <div class="auth-header">

      <a href="index.html" class="auth-brand-badge">

        <div class="brand-icon">
          <i class="fa-solid fa-brain"></i>
        </div>

        <span class="brand-text">RetailMind</span>
        <span class="brand-badge">AI</span>

      </a>

      <h1 class="auth-title">
        Welcome back
      </h1>

      <p class="auth-subtitle">
        Sign in to access your AI predictive retail intelligence dashboard
      </p>

    </div>


    <!-- =========================================
         LOGIN FORM
         ========================================= -->
    <form id="loginForm">

      <!-- Email -->
      <div class="form-group">

        <label
          for="loginEmail"
          class="form-label"
        >
          Email Address *
        </label>

        <div class="input-icon-wrapper">

          <i class="fa-solid fa-envelope"></i>

          <input
            type="email"
            id="loginEmail"
            name="email"
            class="form-control"
            required
            autocomplete="email"
            placeholder="name@retailmind.ai"
          >

        </div>

      </div>


      <!-- Password -->
      <div class="form-group">

        <div
          style="
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.375rem;
          "
        >

          <label
            for="loginPass"
            class="form-label"
            style="margin-bottom: 0;"
          >
            Password *
          </label>

          <a
            href="forgot-password.html"
            style="
              font-size: 0.75rem;
              color: var(--primary);
            "
          >
            Forgot Password?
          </a>

        </div>

        <div class="input-icon-wrapper">

          <i class="fa-solid fa-lock"></i>

          <input
            type="password"
            id="loginPass"
            name="password"
            class="form-control"
            required
            autocomplete="current-password"
            placeholder="••••••••"
          >

        </div>

      </div>


      <!-- Remember Me -->
      <div
        style="
          display: flex;
          align-items: center;
          justify-content: space-between;
          margin-bottom: 1.5rem;
        "
      >

        <label
          for="rememberMe"
          style="
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.8125rem;
            cursor: pointer;
          "
        >

          <input
            type="checkbox"
            id="rememberMe"
            name="rememberMe"
            checked
            style="
              width: 16px;
              height: 16px;
              accent-color: var(--primary);
            "
          >

          <span>
            Remember me for 30 days
          </span>

        </label>

      </div>


      <!-- Login Button -->
      <button
        type="submit"
        id="loginSubmitBtn"
        class="btn btn-primary btn-lg"
        style="width: 100%;"
      >

        <i class="fa-solid fa-arrow-right-to-bracket"></i>

        <span>
          Sign In to Dashboard
        </span>

      </button>

    </form>


    <!-- =========================================
         SEPARATOR
         ========================================= -->
    <div class="auth-separator">
      <span>Or continue with</span>
    </div>


    <!-- =========================================
         SOCIAL LOGIN
         ========================================= -->
    <div
      style="
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.75rem;
        margin-bottom: 1.5rem;
      "
    >

      <button
        type="button"
        id="googleLoginBtn"
        class="btn btn-outline"
      >
        <i class="fa-brands fa-google"></i>
        Google SSO
      </button>


      <button
        type="button"
        id="microsoftLoginBtn"
        class="btn btn-outline"
      >
        <i class="fa-brands fa-microsoft"></i>
        Office 365
      </button>

    </div>


    <!-- =========================================
         REGISTER LINK
         ========================================= -->
    <div
      style="
        text-align: center;
        font-size: 0.8125rem;
        color: var(--muted);
      "
    >

      Don't have a retail merchant account?

      <a
        href="register.html"
        style="
          font-weight: 700;
          color: var(--primary);
        "
      >
        Start Free Trial
      </a>

    </div>

  </div>


  <!-- =========================================
       JAVASCRIPT
       ========================================= -->
 
<!-- Supabase JavaScript SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- RetailMind Supabase Configuration -->
<script src="js/supabase.js"></script>

<!-- Authentication Logic -->
<script src="js/auth.js"></script>

<!-- General Application Logic -->
<script src="js/app.js"></script>


</body>
</html>
