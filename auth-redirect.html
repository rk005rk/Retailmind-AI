<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checking your account | RetailMind AI</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #f7f8fc;
            font-family: Arial, sans-serif;
            color: #202438;
        }

        .card {
            width: min(360px, calc(100% - 48px));
            padding: 32px;
            text-align: center;
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 32px #18233b12;
        }

        .spinner {
            width: 32px;
            height: 32px;
            margin: 0 auto 20px;
            border: 4px solid #e5e7eb;
            border-top-color: #5a1188;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        #status {
            color: #62697b;
            line-height: 1.5;
        }
    </style>
</head>

<body>
    <main class="card">
        <div class="spinner" id="spinner"></div>
        <h2>RetailMind AI</h2>
        <p id="status">Checking your account...</p>
    </main>

    <!-- Use the SAME Supabase client setup as login.html -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>

    <script>
        (async function () {
            const status = document.getElementById('status');
            const spinner = document.getElementById('spinner');

            function fail(message) {
                spinner.style.display = 'none';
                status.textContent = message;
            }

            try {
                if (!window.supabaseClient) {
                    throw new Error(
                        'Supabase client was not initialized. Check the script path.'
                    );
                }

                const { data: { session }, error: sessionError } =
                    await window.supabaseClient.auth.getSession();

                if (sessionError) throw sessionError;

                if (!session?.user) {
                    window.location.replace('login.html');
                    return;
                }

                const { data: memberships, error: membershipError } =
                    await window.supabaseClient
                        .from('business_members')
                        .select('business_id, role')
                        .eq('user_id', session.user.id);

                if (membershipError) throw membershipError;

                if (!memberships || memberships.length === 0) {
                    // Replace this with your actual business setup page.
                    window.location.replace('onboarding.html');
                    return;
                }

                if (memberships.length === 1) {
                    window.location.replace('dashboard.html');
                    return;
                }

                // Multiple businesses: business selection should be implemented.
                fail('Your account belongs to multiple businesses. Please select a business.');
            } catch (error) {
                console.error('Account routing failed:', error);
                fail('We could not verify your business membership. Please refresh or sign in again.');
            }
        })();
    </script>
</body>

</html>
